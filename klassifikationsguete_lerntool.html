<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensitivität, Spezifität & prädiktive Werte – interaktiv</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:#f0efec;
  --krank:#2a78d6; --krank-l:#cde2fb; --krank-ink:#1c5cab;
  --gesund:#eb6834; --gesund-l:#fbdccd; --gesund-ink:#b4461a;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:#252523;
    --krank:#3987e5; --krank-l:#1f3a5c; --krank-ink:#86b6ef;
    --gesund:#d95926; --gesund-l:#4a2a1c; --gesund-ink:#f0a07e;
  }
}
*{box-sizing:border-box}
html{font-size:15px}
body.beamer{font-size:18px}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:20px 18px 40px}
body.beamer .wrap{max-width:1600px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:1.55em;margin:0 0 2px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:0;font-size:.95em}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:.9em;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--axis)}
button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grid{display:grid;gap:14px;margin-top:14px;align-items:start}
.g2{grid-template-columns:1fr 1fr}
.g32{grid-template-columns:3fr 2fr}
@media (max-width:900px){.g2,.g32{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-top:14px}
.grid .panel{margin-top:0}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 8px}
.tog{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;padding:2px 6px;text-align:left;font-size:1em;font-weight:620;border-radius:6px}
.tog:hover{background:var(--wash)}
.tog .chev{display:inline-block;width:1em;color:var(--muted);transition:transform .15s;font-size:.85em}
.panel.open .tog .chev{transform:rotate(90deg)}
.tog .peek{font-weight:400;color:var(--muted);font-size:.85em;margin-left:auto;padding-left:10px;text-align:right}
.panel.open .tog .peek{display:none}
.info{width:26px;height:26px;padding:0;border-radius:50%;font-size:.8em;font-weight:700;font-style:italic;font-family:Georgia,serif;flex:none;color:var(--ink2)}
.info.on{background:var(--ink);color:var(--surface)}
.infobox{display:none;margin:0 16px 10px;padding:10px 12px;border-radius:8px;background:var(--wash);font-size:.9em;color:var(--ink)}
.panel.showinfo>.infobox{display:block}
.pb{display:none;padding:0 16px 16px}
.panel.open>.pb{display:block}
.hint{color:var(--ink2);font-size:.85em;margin:0 0 10px}

.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:900px){.scen{grid-template-columns:1fr}}
.sc{border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:var(--page);display:flex;flex-direction:column;gap:6px}
.sc.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sc .top{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:20px}
.tag{font-size:.72em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.badge{font-size:.72em;padding:1px 7px;border-radius:999px;border:1px solid var(--axis);color:var(--ink2)}
.sc h3{margin:0;font-size:.98em;font-weight:620}
.sc p{margin:0;font-size:.82em;color:var(--ink2)}
.sc .labels{font-size:.8em;color:var(--muted)}
.sc .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.sc .opts button{font-size:.8em;padding:4px 9px}
.sc .opts button small{opacity:.7}
.foot{font-size:.8em;color:var(--muted);margin:10px 0 0}

.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 22px}
@media (max-width:900px){.controls{grid-template-columns:1fr}}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.9em;font-weight:560}
.ctl label small{font-weight:400;color:var(--muted)}
.ctl .row{display:flex;gap:8px;align-items:center}
.ctl input[type=range]{flex:1;accent-color:var(--ink);height:26px}
input[type=number],.ctl input[type=text]{width:5.6em;font:inherit;font-size:.9em;padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:var(--page);color:var(--ink);font-variant-numeric:tabular-nums}
.ctl input[type=text]{width:100%}
.ctl .unit{color:var(--muted);font-size:.85em;width:1.2em}
.note{font-size:.82em;color:var(--muted);margin:0}
select{font:inherit;font-size:.9em;padding:3px 6px;border-radius:6px;border:1px solid var(--border);background:var(--page);color:var(--ink)}
.lblgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 18px}
@media (max-width:900px){.lblgrid{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.chips span{font-size:.85em;color:var(--ink2);margin-right:2px}
.chips button{font-size:.8em;padding:4px 10px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--page);position:relative}
.kpi .k{font-size:.85em;color:var(--ink2);font-weight:560;display:flex;align-items:center;gap:6px;padding-right:28px}
.kpi .k i{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.kpi .v{font-size:2.3em;font-weight:650;letter-spacing:-.02em;line-height:1.15;margin:2px 0}
.kpi .f{font-size:.82em;color:var(--muted)}
.kpi .info{position:absolute;top:8px;right:8px;width:22px;height:22px}
.kpi .kinfo{display:none;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--wash);font-size:.84em}
.kpi.showinfo .kinfo{display:block}

table.vft{border-collapse:separate;border-spacing:3px;width:100%;font-variant-numeric:tabular-nums;font-size:.95em}
.vft th{font-weight:560;color:var(--ink2);font-size:.88em;padding:4px 6px;text-align:center}
.vft td{text-align:center;padding:9px 6px;border-radius:6px}
.vft td b{display:block;font-size:1.25em}
.vft td small{font-size:.78em;opacity:.85}
.vft .rp{background:var(--krank);color:#fff}
.vft .fn{background:var(--krank-l)}
.vft .fp{background:var(--gesund);color:#fff}
.vft .rn{background:var(--gesund-l)}
.vft .sum{background:var(--page);color:var(--ink2)}
.formulas{margin-top:12px;font-size:.9em;display:grid;gap:6px}
.formulas div{padding:6px 10px;border-radius:8px;background:var(--page);font-variant-numeric:tabular-nums}
.formulas .lbl{font-weight:600;display:inline-block;min-width:3.4em}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84em;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i,.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.sw-rp{background:var(--krank)}.sw-fn{background:var(--krank-l);outline:1px solid var(--krank);outline-offset:-1px}
.sw-fp{background:var(--gesund)}.sw-rn{background:var(--gesund-l);outline:1px solid var(--gesund);outline-offset:-1px}

svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink2)}
.split .ttl{font-size:.88em;font-weight:560;margin:10px 0 4px;display:flex;justify-content:space-between;gap:8px}
.split .ttl:first-child{margin-top:0}
.split .ttl span{color:var(--muted);font-weight:400;white-space:nowrap}
.split .sub2{font-size:.82em;color:var(--ink2);margin-top:4px;font-variant-numeric:tabular-nums}
.bar{display:flex;height:34px;gap:2px;border-radius:6px;overflow:hidden}
.bar div{display:flex;align-items:center;justify-content:center;font-size:.82em;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0}
.bigtake{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--page);font-size:.92em}

/* Kosten */
.costgrid{display:grid;grid-template-columns:2fr 3fr;gap:18px;align-items:start}
@media (max-width:900px){.costgrid{grid-template-columns:1fr}}
.meaning{display:grid;gap:8px;margin-top:12px}
.meaning div{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--page);font-size:.88em}
.meaning .sw{margin-top:4px}
.meaning b{white-space:nowrap}
.meaning .disc{font-size:.84em;color:var(--ink2);background:none;padding:0 2px}
.ratioTxt{font-size:.9em;font-weight:600;margin:2px 0 0;min-height:1.4em}
details.adv{margin-top:10px;font-size:.88em}
details.adv summary{cursor:pointer;color:var(--ink2)}
.advgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.advgrid label{display:flex;flex-direction:column;gap:3px;font-size:.85em;color:var(--ink2)}
.advgrid input{width:100%}
.cbtab{width:100%;border-collapse:collapse;font-size:.88em;font-variant-numeric:tabular-nums;margin-top:6px}
.cbtab td{padding:5px 4px;border-bottom:1px solid var(--grid)}
.cbtab td:nth-child(n+2){text-align:right}
.cbtab tr.tot td{font-weight:650;border-bottom:0;border-top:1.5px solid var(--axis)}
.cbtab tr.cmp td{color:var(--ink2);border-bottom:0}
.optline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;font-size:.88em}

.secret{transition:filter .25s}
body.guess:not(.revealed) .secret{filter:blur(9px);user-select:none;pointer-events:none}
.revealbar{display:none;margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--surface);align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
body.guess .revealbar{display:flex}
.revealbar button{background:var(--surface);color:var(--ink)}
.tabs{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:none}
.tabs button{border:0;border-radius:0;padding:4px 10px;font-size:.8em}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;padding:6px 9px;border-radius:6px;opacity:0;transition:opacity .1s;z-index:10;font-variant-numeric:tabular-nums;max-width:260px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:.92em;margin:0}
dt{font-weight:600}dd{margin:0;color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
  </div>
  <div class="btns">
    <button id="btnLang" lang="en"></button>
    <button id="btnAll"></button>
    <button id="btnGuess" data-t="guess"></button>
    <button id="btnBeamer" data-t="beamer"></button>
  </div>
</header>

<section class="panel open" data-panel="scen">
  <div class="ph"><button class="tog"><span class="chev">▶</span><span data-t="pScen"></span><span class="peek" id="peekScen"></span></button><button class="info">i</button></div>
  <div class="infobox" data-t="infoScen"></div>
  <div class="pb"><div class="scen" id="scenGrid"></div><p class="foot" data-t="footScen"></p></div>
</section>

<section class="panel" data-panel="labels">
  <div class="ph"><button class="tog"><span class="chev">▶</span><span data-t="pLabels"></span><span class="peek" id="peekLabels"></span></button><button class="info">i</button></div>
  <div class="infobox" data-t="infoLabels"></div>
  <div class="pb">
    <div class="lblgrid">
      <div class="ctl"><label><span data-t="lk"></span><small data-t="lkS"></small></label><input type="text" id="l_k" maxlength="30"></div>
      <div class="ctl"><label><span data-t="lg"></span><small data-t="lgS"></small></label><input type="text" id="l_g" maxlength="30"></div>
      <div class="ctl"><label><span data-t="lp"></span><small data-t="lpS"></small></label><input type="text" id="l_p" maxlength="30"></div>
      <div class="ctl"><label><span data-t="ln"></span><small data-t="lnS"></small></label><input type="text" id="l_n" maxlength="30"></div>
    </div>
    <div class="chips" id="labelChips"></div>
  </div>
</section>

<section class="panel open" data-panel="ctl">
  <div class="ph"><button class="tog"><span class="chev">▶</span><span data-t="pCtl"></span><span class="peek" id="peekCtl"></span></button><button class="info">i</button></div>
  <div class="infobox" id="infoCtl"></div>
  <div class="pb">
    <div class="controls">
      <div class="ctl"><label><span data-t="lBr"></span><small id="lbBr"></small></label>
        <div class="row"><input type="range" id="r_br" min="0" max="1000" step="1"><input type="number" id="n_br" min="0.1" max="99" step="0.1"><span class="unit">%</span></div></div>
      <div class="ctl"><label><span data-t="lSens"></span><small id="lbSens"></small></label>
        <div class="row"><input type="range" id="r_sens" min="1" max="99.9" step="0.1"><input type="number" id="n_sens" min="1" max="99.9" step="0.1"><span class="unit">%</span></div></div>
      <div class="ctl"><label><span data-t="lSpec"></span><small id="lbSpec"></small></label>
        <div class="row"><input type="range" id="r_spec" min="1" max="99.9" step="0.1"><input type="number" id="n_spec" min="1" max="99.9" step="0.1"><span class="unit">%</span></div></div>
    </div>
    <p class="note" style="margin-top:8px" data-t="noteCtl"></p>
  </div>
</section>

<div class="revealbar"><span id="guessQ"></span><button id="btnReveal" data-t="reveal"></button></div>

<section class="panel open" data-panel="kpi">
  <div class="ph"><button class="tog"><span class="chev">▶</span><span data-t="pKpi"></span><span class="peek secret" id="peekKpi"></span></button><button class="info">i</button></div>
  <div class="infobox" data-t="infoKpi"></div>
  <div class="pb">
    <div class="kpis">
      <div class="kpi"><button class="info">i</button><div class="k" data-t="kSens"></div><div class="v" id="k_sens"></div><div class="f" id="f_sens"></div><div class="kinfo" id="i_sens"></div></div>
      <div class="kpi"><button class="info">i</button><div class="k" data-t="kSpec"></div><div class="v" id="k_spec"></div><div class="f" id="f_spec"></div><div class="kinfo" id="i_spec"></div></div>
      <div class="kpi"><button class="info">i</button><div class="k"><i style="background:var(--krank)"></i><span data-t="kPpv"></span></div><div class="v secret" id="k_ppv"></div><div class="f" id="f_ppv"></div><div class="kinfo" id="i_ppv"></div></div>
      <div class="kpi"><button class="info">i</button><div class="k"><i style="background:var(--gesund)"></i><span data-t="kNpv"></span></div><div class="v secret" id="k_npv"></div><div class="f" id="f_npv"></div><div class="kinfo" id="i_npv"></div></div>
    </div>
  </div>
</section>

<div class="grid g32">
  <section class="panel open" data-panel="icons">
    <div class="ph"><button class="tog"><span class="chev">▶</span><span data-t="pIcons"></span></button><button class="info">i</button></div>
    <div class="infobox" id="infoIcons"></div>
    <div class="pb"><svg id="icons" viewBox="0 0 600 240" role="img"></svg><div class="legend" id="iconLegend"></div></div>
  </section>
  <section class="panel open" data-panel="split">
    <div class="ph"><button class="tog"><span class="chev">▶</span><span data-t="pSplit"></span></button><button class="info">i</button></div>
    <div class="infobox" id="infoSplit"></div>
    <div class="pb"><div class="split secret" id="split"></div><div class="bigtake secret" id="takeaway"></div></div>
  </section>
</div>

<div class="grid g2">
  <section class="panel" data-panel="vft">
    <div class="ph"><button class="tog"><span class="chev">▶</span><span data-t="pVft"></span></button><button class="info">i</button></div>
    <div class="infobox" data-t="infoVft"></div>
    <div class="pb">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">
        <p class="hint" style="margin:0" data-t="hintVft"></p>
        <label style="font-size:.85em;color:var(--ink2);white-space:nowrap"><span data-t="persons"></span> <select id="s_N"><option value="100">100</option><option value="1000" selected>1000</option><option value="10000">10000</option><option value="100000">100000</option></select></label>
      </div>
      <table class="vft" id="vft"></table>
      <div class="formulas" id="formulas"></div>
    </div>
  </section>
  <section class="panel" data-panel="tree">
    <div class="ph"><button class="tog"><span class="chev">▶</span><span data-t="pTree"></span></button><button class="info">i</button></div>
    <div class="infobox" data-t="infoTree"></div>
    <div class="pb"><svg id="tree" viewBox="0 0 620 300" role="img"></svg></div>
  </section>
</div>

<div class="grid g2">
  <section class="panel" data-panel="line">
    <div class="ph"><button class="tog"><span class="chev">▶</span><span data-t="pLine"></span></button><button class="info">i</button></div>
    <div class="infobox" data-t="infoLine"></div>
    <div class="pb">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px">
        <p class="hint" style="margin:0" data-t="hintLine"></p>
        <div class="tabs"><button id="ax_log" class="on">log</button><button id="ax_lin">linear</button></div>
      </div>
      <div class="secret"><svg id="line" viewBox="0 0 600 300" role="img"></svg></div>
      <div class="legend" id="lineLegend"></div>
    </div>
  </section>
  <section class="panel" data-panel="dist">
    <div class="ph"><button class="tog"><span class="chev">▶</span><span data-t="pDist"></span></button><button class="info">i</button></div>
    <div class="infobox" data-t="infoDist"></div>
    <div class="pb">
      <div class="controls" style="grid-template-columns:1fr 1fr">
        <div class="ctl"><label><span data-t="lD"></span><small data-t="lDs"></small></label>
          <div class="row"><input type="range" id="r_d" min="0" max="5" step="0.01"><input type="number" id="n_d" min="-3" max="7" step="0.01"></div></div>
        <div class="ctl"><label><span data-t="lC"></span><small data-t="lCs"></small></label>
          <div class="row"><input type="range" id="r_c" min="-4" max="9" step="0.01"><input type="number" id="n_c" min="-4" max="9" step="0.01"></div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap">
        <p class="hint" style="margin:0" data-t="hintDist"></p>
        <label style="font-size:.85em;color:var(--ink2)"><input type="checkbox" id="c_weight"> <span data-t="weight"></span></label>
      </div>
      <svg id="dist" viewBox="0 0 600 250" role="img" style="touch-action:none;cursor:ew-resize"></svg>
      <div class="legend" id="distLegend"></div>
      <div style="display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center;margin-top:10px">
        <svg id="roc" viewBox="0 0 220 220" role="img"></svg>
        <div style="font-size:.88em;color:var(--ink2)" id="rocText"></div>
      </div>
    </div>
  </section>
</div>

<section class="panel" data-panel="cost">
  <div class="ph"><button class="tog"><span class="chev">▶</span><span data-t="pCost"></span><span class="peek" id="peekCost"></span></button><button class="info">i</button></div>
  <div class="infobox" data-t="infoCost"></div>
  <div class="pb">
    <div class="costgrid">
      <div>
        <div class="ctl">
          <label><span data-t="costQ"></span></label>
          <div class="row"><input type="range" id="r_ratio" min="-100" max="100" step="1" value="0"></div>
          <div style="display:flex;justify-content:space-between;font-size:.78em;color:var(--muted)"><span data-t="costL"></span><span data-t="costR"></span></div>
          <p class="ratioTxt" id="ratioTxt"></p>
        </div>
        <details class="adv" id="advBox"><summary data-t="advSum"></summary>
          <p class="note" style="margin:6px 0 0" data-t="advHint"></p>
          <div class="advgrid">
            <label><span id="al_RP"></span><input type="number" id="cv_RP" step="0.5"></label>
            <label><span id="al_FP"></span><input type="number" id="cv_FP" step="0.5"></label>
            <label><span id="al_FN"></span><input type="number" id="cv_FN" step="0.5"></label>
            <label><span id="al_RN"></span><input type="number" id="cv_RN" step="0.5"></label>

  <dt>Kernaussage</dt><dd>Sensitivität und Spezifität sind (näherungsweise) Eigenschaften des Tests. PPV und NPV hängen zusätzlich von der Basisrate ab. Welcher Cut-off „richtig“ ist, hängt außerdem davon ab, wie schwer die beiden Fehlerarten wiegen.</dd>`
},

const t=(k,...a)=>{const v=T[S.lang][k];return typeof v==='function'?v(...a):v;};

// ================= Kern =================
function fromSensSpec(){const se=clamp(S.sens,0.001,0.999),sp=clamp(S.spec,0.001,0.999);S.c=invPhi(sp);S.d=S.c-invPhi(1-se);}
function fromCut(){S.sens=1-Phi(S.c-S.d);S.spec=Phi(S.c);}
function counts(N){const K=Math.round(S.br*N),G=N-K;const RP=Math.round(S.sens*K),FN=K-RP;const FP=Math.round((1-S.spec)*G),RN=G-FP;return {N,K,G,RP,FN,FP,RN};}
function expCost(c){const se=1-Phi(c-S.d),sp=Phi(c),k=S.costs;
  return 1000*(S.br*(se*k.RP+(1-se)*k.FN)+(1-S.br)*((1-sp)*k.FP+sp*k.RN));}
function optimum(){let best=null;const lo=Math.min(0,S.d)-6,hi=Math.max(0,S.d)+6,n=1200;
  for(let i=0;i<=n;i++){const c=lo+(hi-lo)*i/n,v=expCost(c);if(!best||v<best.v)best={c,v};}
  const allP=1000*(S.br*S.costs.RP+(1-S.br)*S.costs.FP),allN=1000*(S.br*S.costs.FN+(1-S.br)*S.costs.RN);
  const edge=best.c<=lo+0.01||best.c>=hi-0.01;
  return {...best,allP,allN,useless:edge||best.v>=Math.min(allP,allN)-1e-6};}

const $=id=>document.getElementById(id);
const brToPos=br=>Math.round((Math.log10(br)+3)/(Math.log10(0.99)+3)*1000);
const posToBr=p=>Math.pow(10,-3+p/1000*(Math.log10(0.99)+3));

function syncInputs(skip){
  const set=(id,v)=>{if(skip!==id)$(id).value=v;};
  set('r_br',brToPos(S.br));set('n_br',+(S.br*100).toFixed(S.br<0.01?2:1));
  set('r_sens',(S.sens*100).toFixed(1));set('n_sens',+(S.sens*100).toFixed(1));
  set('r_spec',(S.spec*100).toFixed(1));set('n_spec',+(S.spec*100).toFixed(1));
  set('r_d',S.d.toFixed(2));set('n_d',+S.d.toFixed(2));
  set('r_c',S.c.toFixed(2));set('n_c',+S.c.toFixed(2));
  for(const k of ['RP','FP','FN','RN'])if(skip!=='cv_'+k)$('cv_'+k).value=+S.costs[k].toFixed(2);
}
function changed(skip,keepScen){if(!keepScen)S.scen=null;syncInputs(skip);
  if(document.body.classList.contains('guess'))document.body.classList.remove('revealed');render();}

$('r_br').addEventListener('input',e=>{S.br=posToBr(+e.target.value);changed('r_br');});
$('n_br').addEventListener('change',e=>{S.br=clamp(+e.target.value/100,0.001,0.99);changed();});
for(const k of ['sens','spec']){
  $('r_'+k).addEventListener('input',e=>{S[k]=+e.target.value/100;fromSensSpec();changed('r_'+k);});
  $('n_'+k).addEventListener('change',e=>{S[k]=clamp(+e.target.value/100,0.01,0.999);fromSensSpec();changed();});
}
for(const k of ['d','c']){
  $('r_'+k).addEventListener('input',e=>{S[k]=+e.target.value;fromCut();changed('r_'+k);});
  $('n_'+k).addEventListener('change',e=>{S[k]=+e.target.value;fromCut();changed();});
}
$('r_ratio').addEventListener('input',e=>{const p=+e.target.value;S.ratio=Math.pow(20,p/100);
  if(Math.abs(p)<4){S.ratio=1;}S.costMode='ratio';S.costs={RP:0,RN:0,FP:S.ratio>=1?1:+(1/S.ratio).toFixed(1),FN:S.ratio>=1?+S.ratio.toFixed(1):1};
  syncInputs('r_ratio');render();});
for(const k of ['RP','FP','FN','RN'])$('cv_'+k).addEventListener('input',e=>{const v=parseFloat(e.target.value);if(isNaN(v))return;
  S.costs[k]=v;S.costMode='custom';syncInputs('cv_'+k);render();});
$('btnOpt').addEventListener('click',()=>{const o=optimum();if(o.useless)return;S.c=clamp(o.c,-4,9);fromCut();changed();});
$('s_N').addEventListener('change',e=>{S.N=+e.target.value;render();});
$('c_weight').addEventListener('change',e=>{S.weight=e.target.checked;render();});
$('btnGuess').addEventListener('click',()=>{document.body.classList.toggle('guess');document.body.classList.remove('revealed');$('btnGuess').classList.toggle('on');});
$('btnReveal').addEventListener('click',()=>document.body.classList.add('revealed'));
$('btnBeamer').addEventListener('click',()=>{document.body.classList.toggle('beamer');$('btnBeamer').classList.toggle('on');});
$('ax_log').addEventListener('click',()=>{S.logx=true;$('ax_log').classList.add('on');$('ax_lin').classList.remove('on');render();});
$('ax_lin').addEventListener('click',()=>{S.logx=false;$('ax_lin').classList.add('on');$('ax_log').classList.remove('on');render();});
$('btnLang').addEventListener('click',()=>{S.lang=S.lang==='de'?'en':'de';
  if(L.set){L={set:L.set,...LABELSETS[L.set][S.lang]};fillLabelInputs();}applyStatic();render();});

document.querySelectorAll('.panel').forEach(p=>{
  p.querySelector(':scope>.ph>.tog').addEventListener('click',()=>{p.classList.toggle('open');updAllBtn();});

function fillLabelInputs(){for(const k of ['k','g','p','n'])$('l_'+k).value=L[k];}
for(const k of ['k','g','p','n'])$('l_'+k).addEventListener('input',e=>{L.set=null;L[k]=e.target.value.trim()||LABELSETS.krank[S.lang][k];render();});
function renderChips(){const box=$('labelChips');box.innerHTML=`<span>${t('templates')}</span>`;
  Object.entries(LABELSETS).filter(([,v])=>v.chip).forEach(([id,v])=>{const ls=v[S.lang];const b=document.createElement('button');
    b.textContent=ls.name;b.title=`${ls.k} / ${ls.g} · ${ls.p} / ${ls.n}`;b.addEventListener('click',()=>{L={set:id,...ls};fillLabelInputs();render();});box.appendChild(b);});}

function applyStatic(){
  document.documentElement.lang=S.lang;document.title=t('docTitle');
  document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=t(el.dataset.t);});
  document.querySelectorAll('.info').forEach(b=>b.title=t('infoTip'));

function renderScen(){
  const lg=S.lang;
  $('scenGrid').innerHTML=SCEN.map(sc=>{const lab=LABELSETS[sc.lab][lg],tx=sc[lg],act=S.scen&&S.scen[0]===sc.id;
    return `<div class="sc ${act?'active':''}">
      <div class="top"><span class="tag">${tx.tag}</span>${sc.ill?`<span class="badge">${t('illus')}</span>`:''}</div>
      <h3>${tx.title}</h3><p>${tx.desc}</p>
      <div class="labels">${t('test')}: ${t('sensA')} ${pct(sc.opts[0].se,0)} · ${t('specA')} ${pct(sc.opts[0].sp,0)} · ${h(lab.k)} / ${h(lab.g)}</div>
      <div class="opts">${sc.opts.map((o,i)=>`<button data-s="${sc.id}" data-i="${i}" class="${act&&S.scen[1]===i?'on':''}">${o[lg]} <small>· BR ${pct(o.br,0)}</small></button>`).join('')}</div></div>`;}).join('');
  $('scenGrid').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const sc=SCEN.find(x=>x.id===b.dataset.s),o=sc.opts[+b.dataset.i];

    L={set:sc.lab,...LABELSETS[sc.lab][S.lang]};fillLabelInputs();changed(null,true);}));

const tip=$('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;const x=e.clientX+14,y=e.clientY+14;
  tip.style.left=Math.min(x,window.innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.min(y,window.innerHeight-tip.offsetHeight-8)+'px';}
function hideTip(){tip.style.opacity=0;}
function CAT(){const c=t('cat');return {RP:{n:c.RP,d:`${h(L.k)}, ${q(L.p)}`,f:'var(--krank)'},FN:{n:c.FN,d:`${h(L.k)}, ${q(L.n)}`,f:'var(--krank-l)',s:'var(--krank)'},
  FP:{n:c.FP,d:`${h(L.g)}, ${q(L.p)}`,f:'var(--gesund)'},RN:{n:c.RN,d:`${h(L.g)}, ${q(L.n)}`,f:'var(--gesund-l)',s:'var(--gesund)'}};}

// ================= Render =================
function render(){
  const ppv=ppvOf(S.br,S.sens,S.spec),npv=npvOf(S.br,S.sens,S.spec);
  renderScen();renderTexts(ppv,npv);
  $('k_sens').textContent=pct(S.sens);$('k_spec').textContent=pct(S.spec);$('k_ppv').textContent=pct(ppv);$('k_npv').textContent=pct(npv);
  renderIcons();renderSplit(ppv,npv);renderTable(ppv);renderTree();renderLine(ppv,npv);renderDist();renderROC();renderCost();
}

function renderTexts(ppv,npv){
  const K=h(L.k),G=h(L.g);
  $('lbBr').textContent=`P(${L.k})`;$('lbSens').textContent=`P(+ | ${L.k})`;$('lbSpec').textContent=`P(− | ${L.g})`;
  $('f_sens').innerHTML=`P(+ | ${K})`;$('f_spec').innerHTML=`P(− | ${G})`;$('f_ppv').innerHTML=`P(${K} | +)`;$('f_npv').innerHTML=`P(${G} | −)`;
  $('i_sens').innerHTML=t('iSens',L);$('i_spec').innerHTML=t('iSpec',L);$('i_ppv').innerHTML=t('iPpv',L);$('i_npv').innerHTML=t('iNpv',L);
  $('infoCtl').innerHTML=t('infoCtl',L);$('infoIcons').innerHTML=t('infoIcons',L);$('infoSplit').innerHTML=t('infoSplit',L);$('guessQ').innerHTML=t('guessQ',L);
  $('peekCtl').textContent=`${t('lBr')} ${pct(S.br)} · ${t('sensA')} ${pct(S.sens)} · ${t('specA')} ${pct(S.spec)}`;
  $('peekKpi').textContent=`PPV ${pct(ppv)} · NPV ${pct(npv)}`;
  $('peekLabels').textContent=`${L.k} / ${L.g} · ${L.p} / ${L.n}`;
  const sc=S.scen&&SCEN.find(x=>x.id===S.scen[0]);
  $('peekScen').textContent=sc?`${sc[S.lang].title}${sc.opts.length>1?' – '+sc.opts[S.scen[1]][S.lang]:''}`:t('own');

  const c=t('cat');$('distLegend').innerHTML=`<span><i class="sw-rp"></i>${c.RP}</span><span><i class="sw-fn"></i>${c.FN}</span><span><i class="sw-fp"></i>${c.FP}</span><span><i class="sw-rn"></i>${c.RN}</span>`;
  $('terms').innerHTML=t('terms',L,t('A'));
}

function renderIcons(){

    s+=`<rect data-k="${k}" x="${col*sz+1}" y="${row*sz+1}" width="${g}" height="${g}" rx="2" fill="${C[k].f}" ${C[k].s?`stroke="${C[k].s}" stroke-width="1"`:''}/>`;});

  function line(mu,w){let d='';for(let i=0;i<=n;i++){const x=xmin+i*step;d+=(i?'L':'M')+xs(x).toFixed(1)+','+ys(w*pdf(x-mu)).toFixed(1);}return d;}

  for(let x=Math.ceil(xmin);x<=xmax;x++)s+=`<text x="${xs(x)}" y="${m.t+ih+15}" text-anchor="middle" font-size="10.5">${x}</text>`;
  s+=`<text x="${m.l+iw/2}" y="${H-3}" text-anchor="middle" font-size="11.5">${t('costX')}</text>`;
  s+=`<text transform="translate(12,${m.t+ih/2}) rotate(-90)" text-anchor="middle" font-size="10.5">${t('costY')}</text>`;
  s+=`<path d="M${pts.map(p=>xs(p[0]).toFixed(1)+','+ys(p[1]).toFixed(1)).join('L')}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const cc=clamp(S.c,xmin,xmax);
  s+=`<line x1="${xs(cc)}" x2="${xs(cc)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--ink2)" stroke-dasharray="3 3"/>`;
  s+=`<circle cx="${xs(cc)}" cy="${ys(expCost(S.c))}" r="5.5" fill="var(--krank)" stroke="var(--surface)" stroke-width="2"/>`;
  s+=`<text x="${xs(cc)+(xs(cc)>W-110?-8:8)}" y="${m.t+10}" text-anchor="${xs(cc)>W-110?'end':'start'}" font-size="11" style="fill:var(--ink2)">${t('curLbl')}</text>`;
  if(!o.useless&&o.c>=xmin&&o.c<=xmax){s+=`<circle cx="${xs(o.c)}" cy="${ys(o.v)}" r="7" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
    s+=`<text x="${xs(o.c)}" y="${ys(o.v)-12}" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--ink)">${t('optLbl')}</text>`;}
  $('costChart').innerHTML=s;
  // Optimum-Text
  if(o.useless){const w=o.allP<=o.allN?q(L.p):q(L.n);$('optTxt').innerHTML=t('optNone',w);$('btnOpt').disabled=true;}
  else{$('optTxt').innerHTML=t('optTxt',num(o.c,2),pct(1-Phi(o.c-S.d)),pct(Phi(o.c)),num(o.v,0));$('btnOpt').disabled=false;}
  const rr=S.costMode==='custom'?'–':(S.ratio>=1?`${num(S.ratio,1)} : 1`:`1 : ${num(1/S.ratio,1)}`);
  $('peekCost').textContent=t('peekCost',rr,num(tot,0));
}

fillLabelInputs();S.scen=['grund',0];fromSensSpec();syncInputs();applyStatic();render();
})();
</script>
